        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ffcc80", "font": {"color": "#222222"}, "id": "registry:orphanet:311059", "label": "Batten Disease Neuronal Ceroid Lipofuscinosis (NCL) Patient Registry", "shape": "dot", "size": 25, "title": "\u003cb\u003eBatten Disease Neuronal Ceroid Lipofuscinosis (NCL) Patient Registry\u003c/b\u003e\u003cbr\u003eType: asset\u003cbr\u003eresource_type: patient_registry\u003cbr\u003esource: Orphanet\u003cbr\u003esource_url: https://www.orpha.net/en/research-trials/registry/311059\u003cbr\u003ecountry: United Kingdom\u003cbr\u003eretrieval_status: verified_by_http"}, {"color": "#ef9a9a", "font": {"color": "#222222"}, "id": "disease:neuronal_ceroid_lipofuscinosis", "label": "Neuronal Ceroid Lipofuscinosis", "shape": "dot", "size": 25, "title": "\u003cb\u003eNeuronal Ceroid Lipofuscinosis\u003c/b\u003e\u003cbr\u003eType: disease\u003cbr\u003esource: Orphanet\u003cbr\u003esource_url: https://www.orpha.net/en/research-trials/registry/311059"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#555555", "font": {"align": "middle", "size": 12}, "from": "disease:neuronal_ceroid_lipofuscinosis", "label": "has_registry", "title": "\u003cb\u003ehas_registry\u003c/b\u003e\u003cbr\u003eSource: https://www.orpha.net/en/research-trials/registry/311059\u003cbr\u003eEvidence: Registry: Batten Disease Neuronal Ceroid Lipofuscinosis (NCL) Patient Registry; Disease covered: Neuronal Ceroid Lipofuscinosis", "to": "registry:orphanet:311059"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"interaction": {"hover": true, "navigationButtons": true, "keyboard": true, "multiselect": true}, "physics": {"enabled": true, "solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -5000, "centralGravity": 0.15, "springLength": 180, "springConstant": 0.05, "damping": 0.4, "avoidOverlap": 1}, "minVelocity": 0.75}, "edges": {"smooth": {"enabled": true, "type": "dynamic"}}, "nodes": {"borderWidth": 1, "shadow": true}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;
