d psychotic-spectrum manifestations.\n    ", "to": "HP:0100851", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "MONDO:0016295", "label": "has_phenotype", "title": "\n    \u003cb\u003eNeuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u2192 \u003cb\u003ehas_phenotype\u003c/b\u003e \u2192\n    \u003cb\u003eanxiety\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:42298645\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Psychiatric symptoms are highly prevalent across NCL forms and encompass a broad clinical spectrum, including early emotional and behavioral dysregulation, neurodevelopmental-like features, anxiety and depressive symptoms, obsessive-compulsive phenomena, and psychotic-spectrum manifestations.\n    ", "to": "HP:0000739", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "MONDO:0008083", "label": "has_phenotype", "title": "\n    \u003cb\u003eCLN4 disease\u003c/b\u003e\n    \u2192 \u003cb\u003ehas_phenotype\u003c/b\u003e \u2192\n    \u003cb\u003eneurodegeneration\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:40855364\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    lysosome-associated CLN4 mutant aggregates, as a critical pathogenic linchpin in CLN4-associated neurodegeneration.\n    ", "to": "HP:0002180", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "MONDO:0008083", "label": "has_phenotype", "title": "\n    \u003cb\u003eCLN4 disease\u003c/b\u003e\n    \u2192 \u003cb\u003ehas_phenotype\u003c/b\u003e \u2192\n    \u003cb\u003elipofuscin accumulation\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:40855364\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    ectopic CHIP improves lysosomal function in CLN4 i3Neurons and effectively alleviates lipofuscin accumulation and cell death in a Drosophila CLN4 disease model.\n    ", "to": "HP:0011813", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "MONDO:0016295", "label": "has_phenotype", "title": "\n    \u003cb\u003eNeuronal Ceroid Lipofuscinoses\u003c/b\u003e\n    \u2192 \u003cb\u003ehas_phenotype\u003c/b\u003e \u2192\n    \u003cb\u003eprogressive neurodegenerative\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:31207290\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    The Neuronal Ceroid Lipofuscinoses are a group of severe and progressive neurodegenerative disorders, which generally present during childhood.\n    ", "to": "HP:0002344", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "HGNC:30100", "label": "associated_with", "title": "\n    \u003cb\u003ePSENEN\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003efamilial Alzheimer disease\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e inferred\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:34964690\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Mutations in components of the \u03b3-secretase underlie familial Alzheimer disease.\n    ", "to": "MONDO:0100087", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "HGNC:2074", "label": "causes", "title": "\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u2192 \u003cb\u003ecauses\u003c/b\u003e \u2192\n    \u003cb\u003ejuvenile neuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:34964690\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Mutations in CLN3 are causative for juvenile neuronal ceroid lipofuscinosis, a rare lysosomal storage disorder considered the most common neurodegenerative disease in children.\n    ", "to": "MONDO:0019262", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "MONDO:0019262", "label": "has_phenotype", "title": "\n    \u003cb\u003ejuvenile neuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u2192 \u003cb\u003ehas_phenotype\u003c/b\u003e \u2192\n    \u003cb\u003eneurodegenerative\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:34964690\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Mutations in CLN3 are causative for juvenile neuronal ceroid lipofuscinosis, a rare lysosomal storage disorder considered the most common neurodegenerative disease in children.\n    ", "to": "HP:0002180", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "HGNC:30100", "label": "associated_with", "title": "\n    \u003cb\u003ePSENEN\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003  "has_phenotype", "title": "\n    \u003cb\u003eKufs disease type A\u003c/b\u003e\n    \u2192 \u003cb\u003ehas_phenotype\u003c/b\u003e \u2192\n    \u003cb\u003ewhite matter changes\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:37802651\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    MR scan of the brain showed white matter changes suggesting leucodystrophy with cortical atrophy.\n    ", "to": "HP:0002500", "width": 2.5}, {"arrows": "to", "dashes": false, "from": "MONDO:0008768", "label": "has_phenotype", "title": "\n    \u003cb\u003eKufs disease type A\u003c/b\u003e\n    \u2192 \u003cb\u003ehas_phenotype\u003c/b\u003e \u2192\n    \u003cb\u003ephotoparoxysmal responses\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e canonical\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:37802651\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Electroencephalogram showed generalised epileptiform abnormalities with photoparoxysmal responses, including at low frequencies (1 Hz).\n    ", "to": "HP:0010852", "width": 2.5}, {"arrows": "to", "dashes": true, "from": "PROV:treatment:enzyme-replacement-therapy", "label": "treats", "title": "\n    \u003cb\u003eenzyme replacement therapy\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003eneuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:39925015\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Current treatment modalities, including enzyme replacement therapy, pharmacological approaches, gene therapy, and stem cell therapy, have demonstrated limited efficacy.\n    ", "to": "MONDO:0016295", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:treatment:gene-therapy", "label": "treats", "title": "\n    \u003cb\u003egene therapy\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003eneuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:39925015\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Current treatment modalities, including enzyme replacement therapy, pharmacological approaches, gene therapy, and stem cell therapy, have demonstrated limited efficacy.\n    ", "to": "MONDO:0016295", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:treatment:stem-cell-therapy", "label": "treats", "title": "\n    \u003cb\u003estem cell therapy\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003eneuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:39925015\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Current treatment modalities, including enzyme replacement therapy, pharmacological approaches, gene therapy, and stem cell therapy, have demonstrated limited efficacy.\n    ", "to": "MONDO:0016295", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "MONDO:0016295", "label": "associated_with", "title": "\n    \u003cb\u003eneuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003emicroglial cells\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e inferred\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:39925015\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    However, emerging evidence suggests a significant relationship between NCL and microglial cells, highlighting the potential of novel microglial cell replacement therapies.\n    ", "to": "PROV:molecule:microglial-cells", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:treatment:microglial-cell-replacement-therapy", "label": "treats", "title": "\n    \u003cb\u003emicroglial cell replacement therapy\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003eneuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e hypothesis\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:39925015\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    However, emerging evidence suggests a significant relationship between NCL and microglial cells, highlighting the potential of novel microglial cell replacement therapies.\n    ", "to": "MONDO:0016295", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "HGNC:2074", "label": "disrupts_pathway", "title": "\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u2192 \u003cb\u003edisrupts_pathway\u003c/b\u003e \u2192\n    \u003cb\u003eglycerophospholipid catabolism\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:36131016\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Loss of CLN3 also disrupts glycerophospholipid catabolism in the lysosome.\n    ", "to": "PROV:pathway:glycerophospholipid-catabolism", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "HGNC:2074", "label": "associated_with", "title": "\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eglycerophosphodiesters\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e inferred\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:36131016\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    CLN3 is required for their lysosomal egress.\n    ", "to": "PROV:molecule:glycerophosphodiesters", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "MONDO:0019262", "label": "associated_with", "title": "\n    \u003cb\u003ejuvenile neuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eglycerophosphoinositol\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:36131016\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    we found elevated levels of glycerophosphoinositol in the cerebrospinal fluid of patients with Batten disease, suggesting the potential use of glycerophosphoinositol as a disease biomarker.\n    ", "to": "PROV:molecule:glycerophosphoinositol", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "HGNC:2074", "label": "associated_with", "title": "\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eglycerophosphodiesters\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:38447580\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    CLN3 loss leads to significant accumulation of glycerophosphodiesters (GPDs), the end products of glycerophospholipid catabolism in the lysosome.\n    ", "to": "PROV:molecule:glycerophosphodiesters", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:glycerophosphodiesters", "label": "disrupts_pathway", "title": "\n    \u003cb\u003eglycerophosphodiesters\u003c/b\u003e\n    \u2192 \u003cb\u003edisrupts_pathway\u003c/b\u003e \u2192\n    \u003cb\u003elysosomal lipid homeostasis\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:38447580\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Our work establishes that the storage material in Batten disease directly disrupts lysosomal lipid homeostasis, suggesting GPD clearance as a potential therapeutic approach to this fatal disease.\n    ", "to": "PROV:pathway:lysosomal-lipid-homeostasis", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:glycerophosphodiesters", "label": "associated_with", "title": "\n    \u003cb\u003eglycerophosphodiesters\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003ePLA2G15\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:38447580\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Mechanistically, GPDs bind and competitively inhibit the lysosomal phospholipases PLA2G15 and PLBD2, which we establish to possess phospholipase B activity.\n    ", "to": "PROV:molecule:pla2g15", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:glycerophosphodiesters", "label": "associated_with", "title": "\n    \u003cb\u003eglycerophosphodiesters\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003ePLBD2\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:38447580\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Mechanistically, GPDs bind and competitively inhibit the lysosomal phospholipases PLA2G15 and PLBD2, which we establish to possess phospholipase B activity.\n    ", "to": "PROV:molecule:plbd2", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "HGNC:2074", "label": "associated_with", "title": "\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003elysophospholipids\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:38447580\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Consistently, lysosomes of CLN3-deficient cells and tissues accumulate toxic lysophospholipids.\n    ", "to": "PROV:molecule:lysophospholipids", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:treatment:enzyme-replacement-therapy", "label": "treats", "title": "\n    \u003cb\u003eenzyme replacement therapy\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003eCLN2 disease\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:40908342\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Since the development of enzyme replacement therapy for CLN2 disease, much has been learnt about the practicalities of its delivery.\n    ", "to": "MONDO:0008769", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "MONDO:0016295", "label": "associated_with", "title": "\n    \u003cb\u003eneuronal ceroid lipofuscinosis\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eautophagy\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:31678162\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    NCL mutations have far-ranging effects on cellular functions including autophagy and synaptic dysfunction.\n    ", "to": "PROV:pathway:autophagy", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:c1", "label": "treats", "title": "\n    \u003cb\u003eC1\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003elysosomal storage disorders\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:41558486\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    modulation of the TFEB-CLN3 signaling axis may hold therapeutic potential for lysosomal storage disorders\n    ", "to": "MONDO:0002561", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:tfeb", "label": "associated_with", "title": "\n    \u003cb\u003eTFEB\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e inferred\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:41558486\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    modulation of the TFEB-CLN3 signaling axis may hold therapeutic potential for lysosomal storage disorders\n    ", "to": "HGNC:2074", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:c1", "label": "associated_with", "title": "\n    \u003cb\u003eC1\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eCLN3\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:41558486\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    the curcumin analog C1, which is a TFEB (transcription factor EB) activator-could enhance CLN3 activity and improve lysosomal function\n    ", "to": "HGNC:2074", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:snca", "label": "associated_with", "title": "\n    \u003cb\u003eSNCA\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eParkinson disease\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:35287553\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Parkinson disease (PD) is a neurodegenerative disorder characterized by the abnormal intracellular accumulation of SNCA/\u03b1-synuclein.\n    ", "to": "MONDO:0005180", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:rhsctsd", "label": "treats", "title": "\n    \u003cb\u003erHsCTSD\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003eParkinson disease\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:35287553\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Thus, enzyme replacement strategies utilizing CTSD may also be of therapeutic interest for the treatment of PD and other synucleinopathies aiming to decrease the SNCA burden.\n    ", "to": "MONDO:0005180", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:treatment:milasen", "label": "associated_with", "title": "\n    \u003cb\u003emilasen\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eseizures\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:31597037\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    There were no serious adverse events, and treatment was associated with objective reduction in seizures (determined by electroencephalography and parental reporting).\n    ", "to": "HP:0001250", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:glycerophosphodiesters", "label": "associated_with", "title": "\n    \u003cb\u003eglycerophosphodiesters\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003eCLN3 disease\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e observed\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:39724071\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Metabolic profiling of isolated lysosomes revealed massive accumulation of glycerophosphodiesters (GPDs) in patients\u0027 lysosomes.\n    ", "to": "MONDO:0008767", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:molecule:glycerophosphodiesters", "label": "associated_with", "title": "\n    \u003cb\u003eglycerophosphodiesters\u003c/b\u003e\n    \u2192 \u003cb\u003eassociated_with\u003c/b\u003e \u2192\n    \u003cb\u003edisease biomarkers\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e inferred\n    \u003cbr\u003e\n    \u003cb\u003eSource:\u003c/b\u003e PMID:39724071\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eQuote:\u003c/b\u003e\u003cbr\u003e\n    Interestingly, a patient with a milder phenotype and genotype displayed lower accumulation of lysosomal GPDs, consistent with their potential role as disease biomarkers.\n    ", "to": "PROV:other:disease-biomarkers", "width": 1.5}, {"arrows": "to", "dashes": true, "from": "PROV:treatment:enzyme-replacement-therapy", "label": "treats", "title": "\n    \u003cb\u003eenzyme replacement therapy\u003c/b\u003e\n    \u2192 \u003cb\u003etreats\u003c/b\u003e \u2192\n    \u003cb\u003eCLN1 disease\u003c/b\u003e\n    \u003cbr\u003e\u003cbr\u003e\n\n    \u003cb\u003eStatus:\u003c/b\u003e provisional\n    \u003cbr\u003e\n    \u003cb\u003eEvidence:\u003c/b\u003e
